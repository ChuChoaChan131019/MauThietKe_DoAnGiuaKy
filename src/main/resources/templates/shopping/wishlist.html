<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Yêu Thích')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main class="w-100 mx-auto px-3 px-md-4 py-5 max-w-1440">
        <div class="row gx-lg-5">
            <!-- Sidebar Navigation for Account -->
            <div class="col-12 col-md-3 mb-5 mb-md-0">
                <div class="d-flex flex-column gap-3 sticky-top" style="top: 100px;">
                    <h4 class="text-serif text-plum mb-4">Tài Khoản</h4>
                    <a th:href="@{/account/profile}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100">Hồ sơ cá nhân</a>
                    <a th:href="@{/account/change-password}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100">Đổi mật khẩu</a>
                    <a th:href="@{/account/orders}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100">Đơn mua</a>
                    <a th:href="@{/account/wishlist}" class="fw-bold text-burgundy text-decoration-none border-bottom border-burgundy pb-2 d-inline-block w-100">Sản phẩm yêu thích</a>
                    <a th:href="@{/account/notifications}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100 d-flex justify-content-between align-items-center">
                        Thông báo
                        <span class="badge bg-burgundy rounded-pill">3</span>
                    </a>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-12 col-md-9">
                <h2 class="text-serif text-plum mb-5">Sản Phẩm Yêu Thích</h2>
                
                <div class="row g-4">
                    <!-- Wishlist Item 1 -->
                    <div class="col-6 col-md-4">
                        <div class="card border-0 rounded-0 h-100 bg-transparent group">
                            <div class="position-relative bg-ivory overflow-hidden mb-3">
                                <a th:href="@{/products/4}"><img src="https://images.unsplash.com/photo-1594035910387-fea47714263f?w=400&q=80" alt="Product" class="w-100 object-fit-cover hover-scale-105 transition-transform" style="aspect-ratio: 3/4;"></a>
                                <button class="btn position-absolute top-0 end-0 m-2 bg-white text-burgundy rounded-circle p-2 shadow-sm border-0 d-flex align-items-center justify-content-center hover-bg-plum hover-text-white transition-colors" style="width: 36px; height: 36px;">
                                    <i class="bi bi-heart-fill"></i>
                                </button>
                                <form th:action="@{/cart/items}" method="post" class="position-absolute bottom-0 start-0 w-100 opacity-0 group-hover-opacity-100 transition-opacity">
                                    <input type="hidden" name="productId" value="4">
                                    <input type="hidden" name="quantity" value="1">
                                    <button type="submit" class="btn w-100 bg-burgundy text-white rounded-0 py-2 border-0 fw-medium">Thêm vào giỏ</button>
                                </form>
                            </div>
                            <div class="card-body p-0">
                                <a th:href="@{/products/4}" class="text-decoration-none">
                                    <h5 class="text-plum fs-6 fw-medium mb-2 hover-burgundy transition-colors line-clamp-2">Nước Hoa Le Labo Santal 33</h5>
                                    <div class="fw-bold text-plum">4.500.000₫</div>
                                </a>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Wishlist Item 2 -->
                    <div class="col-6 col-md-4">
                        <div class="card border-0 rounded-0 h-100 bg-transparent group">
                            <div class="position-relative bg-ivory overflow-hidden mb-3">
                                <a th:href="@{/products/1}"><img src="https://images.unsplash.com/photo-1591561954557-26941169b49e?w=400&q=80" alt="Product" class="w-100 object-fit-cover hover-scale-105 transition-transform" style="aspect-ratio: 3/4;"></a>
                                <button class="btn position-absolute top-0 end-0 m-2 bg-white text-burgundy rounded-circle p-2 shadow-sm border-0 d-flex align-items-center justify-content-center hover-bg-plum hover-text-white transition-colors" style="width: 36px; height: 36px;">
                                    <i class="bi bi-heart-fill"></i>
                                </button>
                                <form th:action="@{/cart/items}" method="post" class="position-absolute bottom-0 start-0 w-100 opacity-0 group-hover-opacity-100 transition-opacity">
                                    <input type="hidden" name="productId" value="1">
                                    <input type="hidden" name="quantity" value="1">
                                    <button type="submit" class="btn w-100 bg-burgundy text-white rounded-0 py-2 border-0 fw-medium">Thêm vào giỏ</button>
                                </form>
                            </div>
                            <div class="card-body p-0">
                                <a th:href="@{/products/1}" class="text-decoration-none">
                                    <h5 class="text-plum fs-6 fw-medium mb-2 hover-burgundy transition-colors line-clamp-2">Canvas Tote Bag</h5>
                                    <div class="fw-bold text-plum">1.190.000₫</div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Empty state (hidden by default) -->
                <div class="d-none text-center py-5">
                    <i class="bi bi-heart text-clay mb-3" style="font-size: 4rem;"></i>
                    <h4 class="text-plum fw-medium mb-2">Chưa có sản phẩm yêu thích</h4>
                    <p class="text-muted mb-4">Hãy thêm những sản phẩm bạn yêu thích để mua sau nhé.</p>
                    <a th:href="@{/products}" class="btn border border-plum text-plum rounded-0 fw-medium px-4 py-2 hover-bg-plum hover-text-white transition-colors">Khám phá sản phẩm</a>
                </div>
            </div>
        </div>
    </main>
    
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
