<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Giỏ hàng của bạn')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main class="w-100 bg-white py-5 cart-main-container">
        <div class="max-w-1440 mx-auto px-3 px-md-4 cart-content-container">
            
            <h1 class="fw-bold text-plum mb-5 border-bottom pb-4 cart-title">
                Giỏ hàng của bạn <span class="fw-normal text-muted cart-count">(2 sản phẩm)</span>
            </h1>
            
            <div class="row gx-lg-5 gy-5">
                <!-- Cart Items -->
                <div class="col-12 col-lg-8">
                    
                    <!-- Item 1 -->
                    <div class="d-flex gap-4 py-4 border-bottom position-relative cart-item-container">
                        <button class="btn border-0 shadow-none position-absolute end-0 top-50 translate-middle-y text-muted hover-burgundy p-0 cart-item-remove-btn"><i class="bi bi-x-lg"></i></button>
                        <div class="position-relative bg-ivory flex-shrink-0 cart-item-img-container">
                            <img src="https://images.unsplash.com/photo-1591561954557-26941169b49e?w=400&q=80" alt="Bag" class="w-100 h-100 object-fit-cover p-2" />
                        </div>
                        <div class="d-flex flex-column justify-content-between py-1">
                            <div>
                                <div class="fw-bold text-uppercase text-muted mb-1 cart-item-brand">NOLA</div>
                                <div class="fw-bold text-plum mb-2 cart-item-title">Canvas Tote Bag</div>
                                <div class="fw-bold text-burgundy cart-item-price">1.190.000đ</div>
                            </div>
                            <div class="d-flex align-items-center border border-clay cart-item-qty-container">
                                <button class="btn border-0 shadow-none text-plum hover-burgundy hover-bg-ivory d-flex align-items-center justify-content-center px-2 h-100"><i class="bi bi-dash"></i></button>
                                <span class="fw-bold text-plum d-flex align-items-center justify-content-center border-start border-end border-clay h-100 cart-item-qty-text">1</span>
                                <button class="btn border-0 shadow-none text-plum hover-burgundy hover-bg-ivory d-flex align-items-center justify-content-center px-2 h-100"><i class="bi bi-plus"></i></button>
                            </div>
                        </div>
                    </div>

                    <!-- Item 2 -->
                    <div class="d-flex gap-4 py-4 border-bottom position-relative cart-item-container">
                        <button class="btn border-0 shadow-none position-absolute end-0 top-50 translate-middle-y text-muted hover-burgundy p-0 cart-item-remove-btn"><i class="bi bi-x-lg"></i></button>
                        <div class="position-relative bg-ivory flex-shrink-0 cart-item-img-container">
                            <img src="https://images.unsplash.com/photo-1594035910387-fea47714263f?w=400&q=80" alt="Perfume" class="w-100 h-100 object-fit-cover p-2" />
                        </div>
                        <div class="d-flex flex-column justify-content-between py-1">
                            <div>
                                <div class="fw-bold text-uppercase text-muted mb-1 cart-item-brand">MAISON 28</div>
                                <div class="fw-bold text-plum mb-2 cart-item-title">Signature Parfum</div>
                                <div class="fw-bold text-burgundy cart-item-price">2.490.000đ</div>
                            </div>
                            <div class="d-flex align-items-center border border-clay cart-item-qty-container">
                                <button class="btn border-0 shadow-none text-plum hover-burgundy hover-bg-ivory d-flex align-items-center justify-content-center px-2 h-100"><i class="bi bi-dash"></i></button>
                                <span class="fw-bold text-plum d-flex align-items-center justify-content-center border-start border-end border-clay h-100 cart-item-qty-text">1</span>
                                <button class="btn border-0 shadow-none text-plum hover-burgundy hover-bg-ivory d-flex align-items-center justify-content-center px-2 h-100"><i class="bi bi-plus"></i></button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Order Summary -->
                <div class="col-12 col-lg-4">
                    <div class="p-4 p-md-5 cart-summary-container">
                        <h2 class="fw-bold text-plum border-bottom pb-3 mb-4 cart-summary-title">Tóm tắt đơn hàng</h2>
                        
                        <div class="d-flex justify-content-between mb-3 text-plum cart-summary-row">
                            <span>Tạm tính</span>
                            <span class="fw-bold">3.680.000đ</span>
                        </div>
                        <div class="d-flex justify-content-between mb-4 pb-4 border-bottom text-plum cart-summary-row cart-summary-row-divider">
                            <span>Phí vận chuyển</span>
                            <span class="fw-bold text-burgundy">Miễn phí</span>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-end mb-4 pb-2">
                            <span class="fw-bold text-plum cart-summary-row">Tổng cộng</span>
                            <span class="fw-bold text-burgundy cart-summary-total-price">3.680.000đ</span>
                        </div>

                        <a th:href="@{/checkout}" class="senvia-btn senvia-btn-primary w-100 text-decoration-none border-0 cart-checkout-btn">
                            Tiến hành thanh toán
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </main>
    
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
