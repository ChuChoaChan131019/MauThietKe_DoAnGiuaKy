<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Đổi Mật Khẩu')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main class="w-100 mx-auto px-3 px-md-4 py-5 max-w-1440">
        <div class="row gx-lg-5">
            <!-- Sidebar Navigation for Account -->
            <div class="col-12 col-md-3 mb-5 mb-md-0">
                <div class="d-flex flex-column gap-3 sticky-top" style="top: 100px;">
                    <h4 class="text-serif text-plum mb-4">Tài Khoản</h4>
                    <a th:href="@{/account/profile}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100">Hồ sơ cá nhân</a>
                    <a th:href="@{/account/change-password}" class="fw-bold text-burgundy text-decoration-none border-bottom border-burgundy pb-2 d-inline-block w-100">Đổi mật khẩu</a>
                    <a th:href="@{/account/orders}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100">Đơn mua</a>
                    <a th:href="@{/account/wishlist}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100">Sản phẩm yêu thích</a>
                    <a th:href="@{/account/notifications}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100 d-flex justify-content-between align-items-center">
                        Thông báo
                        <span class="badge bg-burgundy rounded-pill">3</span>
                    </a>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-12 col-md-9">
                <h2 class="text-serif text-plum mb-5">Đổi Mật Khẩu</h2>
                
                <form class="bg-white p-4 p-md-5 border border-clay shadow-sm" style="max-width: 600px;">
                    <div class="alert alert-danger d-none" role="alert">
                        Mật khẩu hiện tại không đúng.
                    </div>
                    <div class="alert alert-success d-none" role="alert">
                        Mật khẩu đã được cập nhật thành công.
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Mật khẩu hiện tại</label>
                        <input type="password" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Mật khẩu mới</label>
                        <input type="password" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Xác nhận mật khẩu mới</label>
                        <input type="password" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none" required>
                        <div class="invalid-feedback d-none">
                            Mật khẩu xác nhận không khớp.
                        </div>
                    </div>

                    <div class="mt-5">
                        <button type="submit" class="btn bg-burgundy text-white rounded-0 fw-medium text-uppercase px-5 py-3 border-0 w-100 hover-bg-plum transition-colors">Cập nhật mật khẩu</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
