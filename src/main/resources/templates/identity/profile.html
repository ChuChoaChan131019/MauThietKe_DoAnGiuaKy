<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Hồ Sơ Cá Nhân')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main class="w-100 mx-auto px-3 px-md-4 py-5 max-w-1440">
        <div class="row gx-lg-5">
            <!-- Sidebar Navigation for Account -->
            <div class="col-12 col-md-3 mb-5 mb-md-0">
                <div class="d-flex flex-column gap-3 sticky-top" style="top: 100px;">
                    <h4 class="text-serif text-plum mb-4">Tài Khoản</h4>
                    <a th:href="@{/account/profile}" class="fw-bold text-burgundy text-decoration-none border-bottom border-burgundy pb-2 d-inline-block w-100">Hồ sơ cá nhân</a>
                    <a th:href="@{/account/change-password}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100">Đổi mật khẩu</a>
                    <a th:href="@{/account/orders}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100">Đơn mua</a>
                    <a th:href="@{/account/wishlist}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100">Sản phẩm yêu thích</a>
                    <a th:href="@{/account/notifications}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100 d-flex justify-content-between align-items-center">
                        Thông báo
                        <span class="badge bg-burgundy rounded-pill">3</span>
                    </a>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-12 col-md-9">
                <h2 class="text-serif text-plum mb-5">Hồ Sơ Của Bạn</h2>
                
                <form class="bg-white p-4 p-md-5 border border-clay shadow-sm" style="max-width: 600px;">
                    <!-- Avatar section -->
                    <div class="d-flex align-items-center gap-4 mb-5">
                        <div class="rounded-circle bg-ivory overflow-hidden border border-clay d-flex align-items-center justify-content-center" style="width: 100px; height: 100px;">
                            <i class="bi bi-person text-muted" style="font-size: 3rem;"></i>
                        </div>
                        <div>
                            <button type="button" class="btn border border-plum text-plum rounded-0 fw-medium px-4 py-2 hover-bg-plum hover-text-white transition-colors mb-2 d-block">Đổi ảnh đại diện</button>
                            <span class="text-muted small">Định dạng JPEG hoặc PNG. Tối đa 2MB.</span>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Họ và tên</label>
                        <input type="text" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none" value="Nguyễn Văn A" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Số điện thoại</label>
                        <input type="tel" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none" value="0901234567" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Địa chỉ giao hàng mặc định</label>
                        <textarea class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none" rows="3" required>123 Đường Lê Lợi, Phường Bến Thành, Quận 1, TP. Hồ Chí Minh</textarea>
                    </div>

                    <div class="mt-5">
                        <button type="submit" class="btn bg-burgundy text-white rounded-0 fw-medium text-uppercase px-5 py-3 border-0 w-100 hover-bg-plum transition-colors">Lưu thay đổi</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
