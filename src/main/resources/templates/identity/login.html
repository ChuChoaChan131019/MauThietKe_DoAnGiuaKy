<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Đăng nhập')}"></head>
<body class="bg-white m-0 p-0" style="min-height: 100vh;">
    <div class="row g-0 h-100" style="min-height: 100vh;">
        <!-- Left Image -->
        <div class="col-12 col-lg-6 d-none d-lg-block position-relative">
            <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=1200&q=80" alt="Login Lifestyle" class="w-100 h-100 object-fit-cover" />
            <div class="position-absolute top-0 start-0 w-100 h-100" style="background-color: rgba(47, 35, 40, 0.2);"></div>
            <a th:href="@{/}" class="position-absolute text-decoration-none d-flex align-items-center" style="top: 2.5rem; left: 3rem;">
                <span class="text-serif fw-bold text-white text-shadow" style="font-size: 1.875rem; letter-spacing: 0.1em; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">SEN</span>
                <span class="text-serif fw-bold text-shadow" style="font-size: 1.875rem; letter-spacing: 0.1em; color: var(--senvia-clay); text-shadow: 0 2px 4px rgba(0,0,0,0.2);">VIA</span>
            </a>
        </div>
        
        <!-- Right Form -->
        <div class="col-12 col-lg-6 d-flex align-items-center justify-content-center p-4 p-lg-5">
            <div class="w-100" style="max-width: 400px;">
                <a th:href="@{/}" class="d-block d-lg-none text-decoration-none mb-5">
                    <span class="text-serif fw-bold text-plum" style="font-size: 1.875rem; letter-spacing: 0.1em;">SEN</span>
                    <span class="text-serif fw-bold text-burgundy" style="font-size: 1.875rem; letter-spacing: 0.1em;">VIA</span>
                </a>

                <span class="text-uppercase fw-bold text-burgundy d-block mb-3" style="font-size: 10px; letter-spacing: 0.3em;">Welcome Back</span>
                <h1 class="text-serif text-plum mb-3" style="font-size: 3rem;">Đăng nhập</h1>
                <p class="text-muted fw-light mb-5">Truy cập vào tài khoản Senvia để quản lý đơn hàng và lưu lại những sản phẩm yêu thích.</p>
                
                <form th:action="@{/}" method="get" class="d-flex flex-column gap-4">
                    <div class="position-relative">
                        <label class="text-uppercase text-muted d-block mb-2" style="font-size: 11px; letter-spacing: 0.1em;">Email</label>
                        <input type="email" name="username" class="form-control rounded-0 border-0 border-bottom bg-transparent shadow-none px-0 py-2 text-plum transition-colors" style="border-color: var(--senvia-blush) !important; font-size: 14px;" required />
                    </div>
                    <div class="position-relative">
                        <label class="text-uppercase text-muted d-flex justify-content-between mb-2" style="font-size: 11px; letter-spacing: 0.1em;">
                            Mật khẩu
                            <a href="#" class="text-burgundy text-decoration-none hover-text-plum text-capitalize" style="letter-spacing: normal;">Quên mật khẩu?</a>
                        </label>
                        <input type="password" name="password" class="form-control rounded-0 border-0 border-bottom bg-transparent shadow-none px-0 py-2 text-plum transition-colors" style="border-color: var(--senvia-blush) !important; font-size: 14px;" required />
                    </div>
                    
                    <button type="submit" class="senvia-btn senvia-btn-primary w-100 border-0 text-white mt-4 shadow" style="background-color: var(--senvia-plum); font-size: 14px; letter-spacing: 0.1em;">
                        Đăng nhập
                    </button>
                </form>
                
                <p class="mt-5 pt-3 text-center text-muted" style="font-size: 14px;">
                    Chưa có tài khoản? <a th:href="@{/register}" class="text-plum fw-medium text-decoration-none border-bottom border-plum pb-1 hover-burgundy hover-border-burgundy transition-colors">Đăng ký ngay</a>
                </p>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
