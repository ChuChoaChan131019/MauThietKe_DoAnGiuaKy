<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Tất cả sản phẩm')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main class="w-100 bg-white py-5">
        <div class="max-w-1440 mx-auto px-3 px-md-4">
          
            <!-- Top Bar -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-end mb-5 border-bottom pb-4 products-top-bar">
                <div>
                    <div class="text-uppercase fw-medium mb-3 text-muted products-breadcrumb">Trang chủ / Sản phẩm</div>
                    <h1 class="fw-bold text-plum m-0 products-title">Tất cả sản phẩm <span class="fw-normal text-muted ms-2 products-count">(128)</span></h1>
                </div>
                
                <div class="mt-4 mt-md-0">
                    <select class="form-select bg-white text-plum fw-bold rounded-0 shadow-none products-sort">
                        <option>Sắp xếp: Mới nhất</option>
                        <option>Giá: Thấp đến cao</option>
                        <option>Giá: Cao xuống thấp</option>
                    </select>
                </div>
            </div>

            <div class="row gx-lg-5">
                
                <!-- LEFT FILTER - 240px -->
                <aside class="col-12 col-lg-3 col-xl-2 mb-5 mb-lg-0">
                    <div class="d-flex flex-column gap-5 sticky-top products-sidebar">
                        
                        <div>
                            <h3 class="fw-bold text-plum mb-4 products-sidebar-title">Danh mục</h3>
                            <ul class="list-unstyled d-flex flex-column gap-3 text-plum products-sidebar-list">
                                <li class="fw-bold text-burgundy cursor-pointer">Tất cả sản phẩm</li>
                                <li class="hover-burgundy transition-colors cursor-pointer py-1">Thời trang</li>
                                <li class="hover-burgundy transition-colors cursor-pointer py-1">Làm đẹp</li>
                                <li class="hover-burgundy transition-colors cursor-pointer py-1">Nhà cửa</li>
                                <li class="hover-burgundy transition-colors cursor-pointer py-1">Công nghệ</li>
                            </ul>
                        </div>

                        <div class="border-top pt-4 products-sidebar-divider">
                            <h3 class="fw-bold text-plum mb-4 products-sidebar-title">Thương hiệu</h3>
                            <ul class="list-unstyled d-flex flex-column gap-3 text-plum products-sidebar-list">
                                <li class="hover-burgundy transition-colors cursor-pointer d-flex justify-content-between align-items-center">
                                    <div class="form-check m-0 d-flex align-items-center gap-2">
                                        <input type="checkbox" class="form-check-input m-0 rounded-0 products-filter-checkbox" />
                                        <label class="form-check-label products-filter-label">NOLA</label>
                                    </div>
                                    <span class="text-muted products-filter-count">(12)</span>
                                </li>
                                <li class="hover-burgundy transition-colors cursor-pointer d-flex justify-content-between align-items-center">
                                    <div class="form-check m-0 d-flex align-items-center gap-2">
                                        <input type="checkbox" class="form-check-input m-0 rounded-0 products-filter-checkbox" />
                                        <label class="form-check-label products-filter-label">MORI</label>
                                    </div>
                                    <span class="text-muted products-filter-count">(8)</span>
                                </li>
                                <li class="hover-burgundy transition-colors cursor-pointer d-flex justify-content-between align-items-center">
                                    <div class="form-check m-0 d-flex align-items-center gap-2">
                                        <input type="checkbox" class="form-check-input m-0 rounded-0 products-filter-checkbox" />
                                        <label class="form-check-label products-filter-label">MAISON 28</label>
                                    </div>
                                    <span class="text-muted products-filter-count">(15)</span>
                                </li>
                            </ul>
                        </div>

                    </div>
                </aside>

                <!-- RIGHT GRID -->
                <div class="col-12 col-lg-9 col-xl-10">
                    <div class="row g-3 g-md-4">
                        <div class="col-6 col-md-4 col-xl-3" th:each="product : ${products}">
                            <div th:replace="~{fragments/product-card :: product-card(${product})}"></div>
                        </div>
                        <div class="col-6 col-md-4 col-xl-3" th:each="product : ${products}">
                            <div th:replace="~{fragments/product-card :: product-card(${product})}"></div>
                        </div>
                    </div>
                    
                    <!-- Pagination -->
                    <div class="d-flex justify-content-center mt-5 pt-5 border-top products-pagination-container">
                        <div class="d-flex gap-2">
                            <button class="btn border border-clay text-plum hover-burgundy hover-border-burgundy rounded-0 d-flex align-items-center justify-content-center p-0 transition-colors products-page-btn">1</button>
                            <button class="btn border-0 text-white rounded-0 d-flex align-items-center justify-content-center p-0 fw-bold products-page-btn-active">2</button>
                            <button class="btn border border-clay text-plum hover-burgundy hover-border-burgundy rounded-0 d-flex align-items-center justify-content-center p-0 transition-colors products-page-btn">3</button>
                            <button class="btn border border-clay text-plum hover-burgundy hover-border-burgundy rounded-0 d-flex align-items-center justify-content-center p-0 transition-colors products-page-btn">&rarr;</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
    
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
