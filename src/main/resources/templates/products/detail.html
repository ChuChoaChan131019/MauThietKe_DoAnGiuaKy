<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - ' + ${product.name})}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main class="w-100 mx-auto px-3 px-md-4 py-5 product-detail-container">
        <div class="row gx-lg-5 gy-5">
            
            <!-- Gallery - 65% on lg -->
            <div class="col-12 col-lg-7 d-flex flex-column-reverse flex-md-row gap-3">
                <!-- Thumbnails -->
                <div class="d-flex flex-md-column gap-3 overflow-x-auto overflow-md-visible product-detail-thumbnails-container">
                    <div class="position-relative bg-ivory cursor-pointer flex-shrink-0 product-detail-thumbnail-active">
                        <img th:src="${product.image}" alt="Thumbnail 1" class="w-100 h-100 object-fit-cover" />
                    </div>
                    <div class="position-relative bg-ivory cursor-pointer opacity-50 hover-opacity transition-colors flex-shrink-0 product-detail-thumbnail">
                        <img th:src="${product.image}" alt="Thumbnail 2" class="w-100 h-100 object-fit-cover" />
                    </div>
                    <div class="position-relative bg-ivory cursor-pointer opacity-50 hover-opacity transition-colors flex-shrink-0 product-detail-thumbnail">
                        <img th:src="${product.image}" alt="Thumbnail 3" class="w-100 h-100 object-fit-cover" />
                    </div>
                </div>
                <!-- Main Image -->
                <div class="position-relative flex-grow-1 bg-ivory overflow-hidden product-detail-main-img-container">
                    <img th:src="${product.image}" alt="Main product" class="w-100 h-100 object-fit-cover hover-scale-105 transition-transform product-detail-main-img" />
                </div>
            </div>

            <!-- Info - 35% on lg -->
            <div class="col-12 col-lg-5 d-flex flex-column pt-3 sticky-top product-detail-info-col">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-uppercase text-muted product-detail-brand" th:text="${product.brand}">BRAND</span>
                    <button class="btn border-0 shadow-none text-muted hover-plum p-0"><i class="bi bi-share"></i></button>
                </div>
                
                <h1 class="text-serif text-plum mb-4 product-detail-title" th:text="${product.name}">Product Name</h1>
                
                <div class="fw-medium text-burgundy mb-5 product-detail-price" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + '₫'">Price</div>
                
                <p class="text-muted fw-light lh-lg mb-5 product-detail-desc">
                    Sự pha trộn tinh tế giữa nốt hương hoa nhài thanh khiết và xạ hương ấm áp. Một lựa chọn hoàn hảo để bắt đầu ngày mới với phong thái tự tin và hiện đại.
                </p>

                <div class="mb-5">
                    <h4 class="text-uppercase text-plum mb-3 fw-bold product-detail-option-title">Dung tích</h4>
                    <div class="d-flex gap-3">
                        <button class="btn border-plum text-plum rounded-0 fw-medium px-4 py-2 product-detail-option-btn">50ml</button>
                        <button class="btn border-clay text-muted rounded-0 fw-medium px-4 py-2 hover-border-plum transition-colors product-detail-option-btn">100ml</button>
                    </div>
                </div>

                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="d-flex align-items-center border border-clay product-detail-qty-container">
                        <button class="btn border-0 shadow-none text-muted hover-bg-ivory h-100 d-flex align-items-center justify-content-center px-3" onclick="updateQty(-1)"><i class="bi bi-dash"></i></button>
                        <span id="qty" class="text-plum fw-medium text-center product-detail-qty-text">1</span>
                        <button class="btn border-0 shadow-none text-muted hover-bg-ivory h-100 d-flex align-items-center justify-content-center px-3" onclick="updateQty(1)"><i class="bi bi-plus"></i></button>
                    </div>
                    <button class="btn rounded-0 text-white flex-grow-1 fw-medium text-uppercase shadow transition-colors h-100 product-detail-add-btn">
                        Thêm vào giỏ
                    </button>
                    <button class="btn rounded-0 border border-clay text-plum hover-burgundy hover-border-burgundy h-100 transition-colors d-flex align-items-center justify-content-center product-detail-heart-btn">
                        <i class="bi bi-heart product-detail-heart-icon"></i>
                    </button>
                </div>

                <div class="mt-5 pt-4 border-top product-detail-section-divider">
                    <div class="d-flex justify-content-between align-items-center cursor-pointer group mb-4">
                        <span class="text-uppercase fw-medium text-plum product-detail-section-title">Chi tiết sản phẩm</span>
                        <i class="bi bi-plus text-muted group-hover-plum"></i>
                    </div>
                    <div class="d-flex justify-content-between align-items-center cursor-pointer group border-top pt-4 product-detail-section-divider">
                        <span class="text-uppercase fw-medium text-plum product-detail-section-title">Vận chuyển & Đổi trả</span>
                        <i class="bi bi-plus text-muted group-hover-plum"></i>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
    <script>
        function updateQty(change) {
            const qtyEl = document.getElementById('qty');
            let qty = parseInt(qtyEl.innerText);
            qty += change;
            if (qty < 1) qty = 1;
            qtyEl.innerText = qty;
        }
    </script>
</body>
</html>
