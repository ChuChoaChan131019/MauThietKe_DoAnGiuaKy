<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - ' + ${product.name})}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main class="w-100 mx-auto px-3 px-md-4 py-5" style="max-width: 1536px;">
        <div class="row gx-lg-5 gy-5">
            
            <!-- Gallery - 65% on lg -->
            <div class="col-12 col-lg-7 d-flex flex-column-reverse flex-md-row gap-3">
                <!-- Thumbnails -->
                <div class="d-flex flex-md-column gap-3 overflow-x-auto overflow-md-visible" style="width: 100%; max-width: 6rem;">
                    <div class="position-relative bg-ivory cursor-pointer flex-shrink-0" style="aspect-ratio: 4/5; width: 6rem; border: 1px solid var(--senvia-burgundy);">
                        <img th:src="${product.image}" alt="Thumbnail 1" class="w-100 h-100 object-fit-cover" />
                    </div>
                    <div class="position-relative bg-ivory cursor-pointer opacity-50 hover-opacity transition-colors flex-shrink-0" style="aspect-ratio: 4/5; width: 6rem;">
                        <img th:src="${product.image}" alt="Thumbnail 2" class="w-100 h-100 object-fit-cover" />
                    </div>
                    <div class="position-relative bg-ivory cursor-pointer opacity-50 hover-opacity transition-colors flex-shrink-0" style="aspect-ratio: 4/5; width: 6rem;">
                        <img th:src="${product.image}" alt="Thumbnail 3" class="w-100 h-100 object-fit-cover" />
                    </div>
                </div>
                <!-- Main Image -->
                <div class="position-relative flex-grow-1 bg-ivory overflow-hidden" style="aspect-ratio: 4/5;">
                    <img th:src="${product.image}" alt="Main product" class="w-100 h-100 object-fit-cover hover-scale-105 transition-transform" style="transition-duration: 1000ms;" />
                </div>
            </div>

            <!-- Info - 35% on lg -->
            <div class="col-12 col-lg-5 d-flex flex-column pt-3 sticky-top" style="top: 100px; height: fit-content;">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-uppercase text-muted" style="font-size: 10px; letter-spacing: 0.2em;" th:text="${product.brand}">BRAND</span>
                    <button class="btn border-0 shadow-none text-muted hover-plum p-0"><i class="bi bi-share"></i></button>
                </div>
                
                <h1 class="text-serif text-plum mb-4" style="font-size: clamp(2.25rem, 4vw, 3rem); line-height: 1.1;" th:text="${product.name}">Product Name</h1>
                
                <div class="fw-medium text-burgundy mb-5" style="font-size: 24px;" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + '₫'">Price</div>
                
                <p class="text-muted fw-light lh-lg mb-5" style="font-size: 15px;">
                    Sự pha trộn tinh tế giữa nốt hương hoa nhài thanh khiết và xạ hương ấm áp. Một lựa chọn hoàn hảo để bắt đầu ngày mới với phong thái tự tin và hiện đại.
                </p>

                <div class="mb-5">
                    <h4 class="text-uppercase text-plum mb-3 fw-bold" style="font-size: 11px; letter-spacing: 0.1em;">Dung tích</h4>
                    <div class="d-flex gap-3">
                        <button class="btn border-plum text-plum rounded-0 fw-medium px-4 py-2" style="font-size: 14px;">50ml</button>
                        <button class="btn border-clay text-muted rounded-0 fw-medium px-4 py-2 hover-border-plum transition-colors" style="font-size: 14px;">100ml</button>
                    </div>
                </div>

                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="d-flex align-items-center border border-clay" style="height: 56px;">
                        <button class="btn border-0 shadow-none text-muted hover-bg-ivory h-100 d-flex align-items-center justify-content-center px-3" onclick="updateQty(-1)"><i class="bi bi-dash"></i></button>
                        <span id="qty" class="text-plum fw-medium text-center" style="width: 40px;">1</span>
                        <button class="btn border-0 shadow-none text-muted hover-bg-ivory h-100 d-flex align-items-center justify-content-center px-3" onclick="updateQty(1)"><i class="bi bi-plus"></i></button>
                    </div>
                    <button class="btn rounded-0 text-white flex-grow-1 fw-medium text-uppercase shadow transition-colors h-100" style="background-color: var(--senvia-plum); letter-spacing: 0.1em; font-size: 14px;">
                        Thêm vào giỏ
                    </button>
                    <button class="btn rounded-0 border border-clay text-plum hover-burgundy hover-border-burgundy h-100 transition-colors d-flex align-items-center justify-content-center" style="width: 56px;">
                        <i class="bi bi-heart" style="font-size: 20px;"></i>
                    </button>
                </div>

                <div class="mt-5 pt-4 border-top" style="border-color: var(--senvia-ivory) !important;">
                    <div class="d-flex justify-content-between align-items-center cursor-pointer group mb-4">
                        <span class="text-uppercase fw-medium text-plum" style="font-size: 14px; letter-spacing: 0.1em;">Chi tiết sản phẩm</span>
                        <i class="bi bi-plus text-muted group-hover-plum"></i>
                    </div>
                    <div class="d-flex justify-content-between align-items-center cursor-pointer group border-top pt-4" style="border-color: var(--senvia-ivory) !important;">
                        <span class="text-uppercase fw-medium text-plum" style="font-size: 14px; letter-spacing: 0.1em;">Vận chuyển & Đổi trả</span>
                        <i class="bi bi-plus text-muted group-hover-plum"></i>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
    <script>
        function updateQty(change) {
            const qtyEl = document.getElementById('qty');
            let qty = parseInt(qtyEl.innerText);
            qty += change;
            if (qty < 1) qty = 1;
            qtyEl.innerText = qty;
        }
    </script>
</body>
</html>
