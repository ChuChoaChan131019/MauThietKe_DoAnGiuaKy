<header th:fragment="header" class="w-100 d-flex flex-column header-z">
    <!-- TOP BAR - Espresso -->
    <div class="w-100 bg-plum text-white py-2 px-3 px-md-4 d-flex justify-content-between align-items-center header-top-bar">
        <div class="flex-grow-1 d-none d-md-block opacity-75">Miễn phí vận chuyển từ 499.000đ</div>
        <div class="flex-grow-1 text-center fw-medium header-top-text">Senvia Edit — Lựa chọn mới mỗi tuần</div>
        <div class="flex-grow-1 d-none d-md-flex justify-content-end gap-4 opacity-75">
            <a href="#" class="text-white text-decoration-none hover-burgundy transition-colors">Theo dõi đơn hàng</a>
            <a href="#" class="text-white text-decoration-none hover-burgundy transition-colors">Trợ giúp</a>
        </div>
    </div>

    <!-- MAIN HEADER - White/Ivory -->
    <div id="main-header" class="w-100 bg-white sticky-top py-4 transition-all border-bottom header-main">
        <div class="container-fluid max-w-1440 px-3 px-md-4 d-flex align-items-center justify-content-between">
            
            <!-- LOGO -->
            <a th:href="@{/}" class="flex-shrink-0 d-flex align-items-center text-decoration-none group">
                <span class="text-serif fw-bold header-logo-text">SEN</span>
                <span class="text-serif fw-bold header-logo-text-accent">VIA</span>
            </a>

            <!-- SEARCH -->
            <div class="d-none d-md-flex flex-grow-1 mx-4 position-relative header-search-container">
                <input 
                    type="text" 
                    placeholder="Tìm sản phẩm, thương hiệu..." 
                    class="form-control bg-ivory border-0 rounded-0 px-4 py-2 shadow-none transition-all header-search-input"
                />
                <button class="btn position-absolute end-0 top-50 translate-middle-y text-plum hover-burgundy border-0 p-2 shadow-none">
                    <i class="bi bi-search header-icon-sm"></i>
                </button>
            </div>

            <!-- ICONS -->
            <div class="d-flex align-items-center gap-3 gap-md-4 text-plum">
                <button class="btn d-md-none text-plum p-0 border-0 shadow-none"><i class="bi bi-search header-icon-lg"></i></button>
                <a th:href="@{/account/wishlist}" class="text-plum hover-burgundy transition-colors position-relative">
                    <i class="bi bi-heart header-icon-lg"></i>
                </a>
                <a th:href="@{/login}" class="text-plum hover-burgundy transition-colors">
                    <i class="bi bi-person header-icon-lg"></i>
                </a>
                <a th:href="@{/cart}" class="text-plum hover-burgundy transition-colors position-relative d-flex align-items-center gap-2 group">
                    <div class="position-relative">
                        <i class="bi bi-cart header-icon-lg"></i>
                        <span class="position-absolute bg-burgundy text-white fw-bold d-flex align-items-center justify-content-center rounded-circle header-cart-badge">3</span>
                    </div>
                </a>
            </div>
        </div>

        <!-- CATEGORY NAV -->
        <nav class="container-fluid max-w-1440 px-3 px-md-4 mt-3 d-none d-md-block">
            <ul class="list-unstyled d-flex align-items-center gap-4 gap-lg-5 mb-0 fw-medium text-uppercase header-nav-list">
                <li class="position-relative category-nav-item">
                    <a th:href="@{/products}" class="text-plum hover-burgundy transition-colors py-1 d-inline-block text-decoration-none">Mới về</a>
                </li>
                <li class="position-relative category-nav-item">
                    <a th:href="@{/products}" class="text-plum hover-burgundy transition-colors py-1 d-inline-block text-decoration-none">Bán chạy</a>
                </li>
                <li class="position-relative category-nav-item">
                    <a th:href="@{/products}" class="text-plum hover-burgundy transition-colors py-1 d-inline-block text-decoration-none">Thời trang</a>
                </li>
                <li class="position-relative category-nav-item">
                    <a th:href="@{/products}" class="text-plum hover-burgundy transition-colors py-1 d-inline-block text-decoration-none">Làm đẹp</a>
                </li>
                <li class="position-relative category-nav-item">
                    <a th:href="@{/products}" class="text-plum hover-burgundy transition-colors py-1 d-inline-block text-decoration-none">Nhà cửa</a>
                </li>
                <li class="position-relative category-nav-item">
                    <a th:href="@{/products}" class="text-plum hover-burgundy transition-colors py-1 d-inline-block text-decoration-none">Công nghệ</a>
                </li>
                <li class="position-relative category-nav-item">
                    <a th:href="@{/products}" class="text-plum hover-burgundy transition-colors py-1 d-inline-block text-decoration-none">Lifestyle</a>
                </li>
                <li class="position-relative category-nav-item">
                    <a th:href="@{/products}" class="text-plum hover-burgundy transition-colors py-1 d-inline-block text-decoration-none">Phụ kiện</a>
                </li>
                <li class="position-relative category-nav-item">
                    <a th:href="@{/products}" class="text-plum hover-burgundy transition-colors py-1 d-inline-block text-decoration-none">Thương hiệu</a>
                </li>
                <li class="position-relative">
                    <a th:href="@{/products}" class="text-burgundy fw-bold hover-opacity transition-colors py-1 d-inline-block text-decoration-none">SALE</a>
                </li>
            </ul>
        </nav>
    </div>
</header>
