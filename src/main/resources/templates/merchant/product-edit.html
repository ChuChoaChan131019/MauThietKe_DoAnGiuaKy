<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Sửa Sản Phẩm')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main class="w-100 mx-auto px-3 px-md-4 py-5 max-w-1440">
        <div class="row gx-lg-5">
            <div class="col-12 col-md-3 mb-5 mb-md-0">
                <div class="d-flex flex-column gap-3 sticky-top" style="top: 100px;">
                    <h4 class="text-serif text-plum mb-4">Kênh Người Bán</h4>
                    <a th:href="@{/merchant/products}" class="fw-bold text-burgundy text-decoration-none border-bottom border-burgundy pb-2 d-inline-block w-100"><i class="bi bi-box-seam me-2"></i>Quản lý sản phẩm</a>
                </div>
            </div>
            <div class="col-12 col-md-9">
                <div class="mb-4">
                    <a th:href="@{/merchant/products}" class="text-muted text-decoration-none hover-plum transition-colors"><i class="bi bi-arrow-left me-2"></i>Quay lại danh sách</a>
                </div>
                <h2 class="text-serif text-plum mb-4">Sửa Sản Phẩm</h2>
                <form class="bg-white p-4 p-md-5 border border-clay shadow-sm">
                    <div class="mb-4">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Tên sản phẩm *</label>
                        <input type="text" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum" value="Canvas Tote Bag" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Danh mục *</label>
                        <select class="form-select bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum" required>
                            <option value="">Chọn danh mục</option>
                            <option value="1" selected>Phụ kiện</option>
                            <option value="2">Thời trang</option>
                            <option value="3">Nhà cửa</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Mô tả sản phẩm *</label>
                        <textarea class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum" rows="4" required>Túi tote vải canvas chất lượng cao, thiết kế tối giản phù hợp mọi trang phục.</textarea>
                    </div>
                    <div class="row mb-5">
                        <div class="col-md-6 mb-4 mb-md-0">
                            <label class="form-label text-uppercase fw-medium text-plum small mb-2">Giá bán (VNĐ) *</label>
                            <input type="number" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum" value="1190000" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-uppercase fw-medium text-plum small mb-2">Số lượng tồn kho *</label>
                            <input type="number" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum" value="45" required>
                        </div>
                    </div>
                    <h5 class="fw-bold text-plum mb-4 pb-2 border-bottom">Hình ảnh hiện tại</h5>
                    <div class="mb-5">
                        <div class="d-flex gap-3 flex-wrap">
                            <div class="position-relative" style="width: 120px; height: 120px;">
                                <img src="https://images.unsplash.com/photo-1591561954557-26941169b49e?w=200&q=80" alt="Current" class="w-100 h-100 object-fit-cover border border-clay">
                                <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0 rounded-0 m-1"><i class="bi bi-trash"></i></button>
                            </div>
                            <div class="bg-ivory border border-clay d-flex flex-column align-items-center justify-content-center position-relative hover-bg-clay transition-colors" style="width: 120px; height: 120px;">
                                <input type="file" class="position-absolute top-0 start-0 w-100 h-100 opacity-0 cursor-pointer" accept="image/*">
                                <i class="bi bi-camera text-muted fs-4"></i>
                                <span class="small text-muted mt-1">Thêm ảnh</span>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-end gap-3">
                        <button type="submit" class="btn bg-burgundy text-white rounded-0 fw-medium px-5 py-3 border-0 hover-bg-plum transition-colors">Cập Nhật</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
