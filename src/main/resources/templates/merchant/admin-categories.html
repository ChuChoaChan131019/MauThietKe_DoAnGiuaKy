<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Danh Mục Sản Phẩm')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main class="w-100 mx-auto px-3 px-md-4 py-5 max-w-1440">
        <div class="row gx-lg-5">
            <!-- Sidebar Navigation for Admin -->
            <div class="col-12 col-md-3 mb-5 mb-md-0">
                <div class="d-flex flex-column gap-3 sticky-top" style="top: 100px;">
                    <h4 class="text-serif text-plum mb-4">Quản Trị</h4>
                    <a th:href="@{/admin/dashboard}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100"><i class="bi bi-speedometer2 me-2"></i>Tổng quan</a>
                    <a th:href="@{/admin/accounts}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100"><i class="bi bi-people me-2"></i>Tài khoản</a>
                    <a th:href="@{/admin/shop-requests}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100"><i class="bi bi-shop me-2"></i>Duyệt gian hàng</a>
                    <a th:href="@{/admin/shops}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100"><i class="bi bi-buildings me-2"></i>Quản lý gian hàng</a>
                    <a th:href="@{/admin/categories}" class="fw-bold text-burgundy text-decoration-none border-bottom border-burgundy pb-2 d-inline-block w-100"><i class="bi bi-tags me-2"></i>Danh mục</a>
                    <a th:href="@{/admin/orders}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100"><i class="bi bi-receipt-cutoff me-2"></i>Giám sát đơn hàng</a>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-12 col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-5 gap-3">
                    <h2 class="text-serif text-plum m-0">Quản Lý Danh Mục</h2>
                    <button class="btn bg-burgundy text-white rounded-0 fw-medium px-4 py-2 border-0 hover-bg-plum transition-colors d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#categoryModal">
                        <i class="bi bi-plus-lg"></i> Thêm Danh Mục
                    </button>
                </div>

                <div class="row g-4">
                    <!-- Category Item -->
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="bg-white border border-clay p-4 text-center group">
                            <div class="rounded-circle overflow-hidden bg-ivory mx-auto mb-3" style="width: 100px; height: 100px;">
                                <img src="https://images.unsplash.com/photo-1594035910387-fea47714263f?w=200&q=80" alt="Category" class="w-100 h-100 object-fit-cover">
                            </div>
                            <h5 class="text-plum fw-bold mb-1">Làm Đẹp</h5>
                            <div class="text-muted small mb-3">1,240 Sản phẩm</div>
                            <div class="d-flex justify-content-center gap-2 opacity-0 group-hover-opacity-100 transition-opacity">
                                <button class="btn btn-sm border border-plum text-plum rounded-0 px-3 hover-bg-plum hover-text-white transition-colors" data-bs-toggle="modal" data-bs-target="#categoryModal">Sửa</button>
                                <button class="btn btn-sm border border-clay text-muted rounded-0 px-3 hover-border-plum transition-colors">Ẩn</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="bg-white border border-clay p-4 text-center group">
                            <div class="rounded-circle overflow-hidden bg-ivory mx-auto mb-3" style="width: 100px; height: 100px;">
                                <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=200&q=80" alt="Category" class="w-100 h-100 object-fit-cover">
                            </div>
                            <h5 class="text-plum fw-bold mb-1">Thời Trang</h5>
                            <div class="text-muted small mb-3">3,450 Sản phẩm</div>
                            <div class="d-flex justify-content-center gap-2 opacity-0 group-hover-opacity-100 transition-opacity">
                                <button class="btn btn-sm border border-plum text-plum rounded-0 px-3 hover-bg-plum hover-text-white transition-colors" data-bs-toggle="modal" data-bs-target="#categoryModal">Sửa</button>
                                <button class="btn btn-sm border border-clay text-muted rounded-0 px-3 hover-border-plum transition-colors">Ẩn</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Add/Edit Category Modal -->
    <div class="modal fade" id="categoryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-0 border-0 shadow">
                <div class="modal-header border-bottom-0 pt-4 px-4 pb-0">
                    <h5 class="modal-title fw-bold text-plum">Thêm/Sửa Danh Mục</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form>
                        <div class="mb-4 text-center">
                            <div class="bg-ivory border border-clay rounded-circle d-flex align-items-center justify-content-center cursor-pointer hover-bg-clay transition-colors mx-auto mb-2" style="width: 100px; height: 100px;">
                                <i class="bi bi-camera text-muted fs-4"></i>
                            </div>
                            <span class="small text-muted">Tải ảnh đại diện</span>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-uppercase fw-medium text-plum small mb-2">Tên danh mục *</label>
                            <input type="text" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top-0 pb-4 px-4 pt-0 d-flex gap-2 flex-nowrap">
                    <button type="button" class="btn border border-clay text-plum rounded-0 flex-grow-1 m-0 hover-border-plum transition-colors" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn bg-burgundy text-white rounded-0 flex-grow-1 m-0 hover-bg-plum transition-colors">Lưu danh mục</button>
                </div>
            </div>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
