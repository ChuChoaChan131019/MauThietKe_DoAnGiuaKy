<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Đăng Ký Gian Hàng')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main class="w-100 mx-auto px-3 px-md-4 py-5 max-w-1440">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="text-center mb-5">
                    <h2 class="text-serif text-plum mb-3">Đăng Ký Bán Hàng Cùng Senvia</h2>
                    <p class="text-muted">Tiếp cận hàng nghìn khách hàng tiềm năng và phát triển thương hiệu của bạn.</p>
                </div>

                <!-- Status Banner for specific states (Pending, Rejected, Locked) -->
                <!-- <div class="alert alert-warning border-0 rounded-0 d-flex align-items-center mb-5">
                    <i class="bi bi-hourglass-split fs-4 me-3"></i>
                    <div>
                        <div class="fw-bold mb-1">Yêu cầu đang chờ duyệt</div>
                        <div class="small">Chúng tôi đang xem xét thông tin của bạn. Vui lòng quay lại sau.</div>
                    </div>
                </div> -->
                <!-- <div class="alert alert-danger border-0 rounded-0 d-flex align-items-center mb-5">
                    <i class="bi bi-x-circle fs-4 me-3"></i>
                    <div>
                        <div class="fw-bold mb-1">Yêu cầu bị từ chối</div>
                        <div class="small">Lý do: Giấy phép kinh doanh không hợp lệ. Vui lòng cập nhật thông tin và gửi lại.</div>
                    </div>
                </div> -->

                <form th:action="@{/merchant/register}" th:object="${shopRegistrationForm}" method="post"
                      enctype="multipart/form-data" class="bg-white p-4 p-md-5 border border-clay shadow-sm">
                    <div th:if="${registrationError}" class="alert alert-danger border-0 rounded-0" role="alert" th:text="${registrationError}"></div>
                    <h4 class="fw-bold text-plum mb-4 pb-2 border-bottom">Thông tin cơ bản</h4>
                    
                    <div class="mb-4">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Tên gian hàng *</label>
                        <input th:field="*{shopName}" type="text" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum" placeholder="Ví dụ: NOLA Official" required>
                        <div class="text-danger small mt-1" th:errors="*{shopName}"></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Logo gian hàng *</label>
                        <input th:field="*{logo}" type="file" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum" accept="image/jpeg,image/png" required>
                        <div class="text-muted small mt-1">Dung lượng tối đa 2MB, định dạng JPEG/PNG.</div>
                        <div class="text-danger small mt-1" th:errors="*{logo}"></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Mô tả gian hàng *</label>
                        <textarea th:field="*{description}" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum" rows="4" maxlength="2000" placeholder="Giới thiệu về thương hiệu, sản phẩm và câu chuyện của bạn..." required></textarea>
                        <div class="text-danger small mt-1" th:errors="*{description}"></div>
                    </div>

                    <h4 class="fw-bold text-plum mb-4 pb-2 border-bottom mt-5">Thông tin liên hệ</h4>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label text-uppercase fw-medium text-plum small mb-2">Số điện thoại hỗ trợ *</label>
                            <input th:field="*{phone}" type="tel" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum" required>
                            <div class="text-danger small mt-1" th:errors="*{phone}"></div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Địa chỉ kho hàng / Cửa hàng *</label>
                        <textarea th:field="*{address}" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum" rows="3" maxlength="2000" required></textarea>
                        <div class="text-danger small mt-1" th:errors="*{address}"></div>
                    </div>

                    <button type="submit" class="btn bg-burgundy text-white rounded-0 fw-medium text-uppercase px-5 py-3 border-0 w-100 hover-bg-plum transition-colors">Gửi Yêu Cầu Đăng Ký</button>
                </form>
            </div>
        </div>
    </main>
    
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
