<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Seller Center')}"></head>
<body style="min-height: 100vh; background-color: var(--senvia-ivory);">
    <div class="d-flex h-100" style="min-height: 100vh;">
        <aside class="bg-white border-end p-4 d-none d-md-block" style="width: 16rem; border-color: var(--senvia-clay) !important;">
            <h1 class="text-serif text-plum mb-5" style="font-size: 24px;">Seller Center</h1>
            <ul class="list-unstyled d-flex flex-column gap-3" style="font-size: 14px;">
                <li class="text-burgundy fw-medium cursor-pointer">Dashboard</li>
                <li class="text-plum hover-burgundy transition-colors cursor-pointer">Sản phẩm</li>
                <li class="text-plum hover-burgundy transition-colors cursor-pointer">Đơn hàng</li>
            </ul>
        </aside>
        
        <main class="flex-grow-1 p-4 p-md-5">
            <div class="bg-white p-4 p-md-5 shadow-sm mb-4">
                <h2 class="fw-medium text-plum mb-4" style="font-size: 18px;">Tổng quan</h2>
            </div>
        </main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
