<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Thông Tin Gian Hàng')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main class="w-100 mx-auto px-3 px-md-4 py-5 max-w-1440">
        <div class="row gx-lg-5">
            <div class="col-12 col-md-3 mb-5 mb-md-0">
                <div class="d-flex flex-column gap-3 sticky-top" style="top: 100px;">
                    <h4 class="text-serif text-plum mb-4">Kênh Người Bán</h4>
                    <a th:href="@{/merchant/dashboard}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100"><i class="bi bi-graph-up me-2"></i>Thống kê</a>
                    <a th:href="@{/merchant/products}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100"><i class="bi bi-box-seam me-2"></i>Quản lý sản phẩm</a>
                    <a th:href="@{/merchant/orders}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100"><i class="bi bi-receipt me-2"></i>Quản lý đơn hàng</a>
                    <a th:href="@{/merchant/profile}" class="fw-bold text-burgundy text-decoration-none border-bottom border-burgundy pb-2 d-inline-block w-100"><i class="bi bi-shop me-2"></i>Thông tin gian hàng</a>
                </div>
            </div>
            <div class="col-12 col-md-9">
                <h2 class="text-serif text-plum mb-4">Hồ Sơ Gian Hàng</h2>
                <form class="bg-white p-4 p-md-5 border border-clay shadow-sm">
                    <div class="mb-4 d-flex align-items-center gap-4">
                        <div class="position-relative" style="width: 100px; height: 100px;">
                            <img src="https://images.unsplash.com/photo-1540200049848-d9813ea0e120?w=200&q=80" alt="Logo" class="w-100 h-100 rounded-circle object-fit-cover border border-clay">
                        </div>
                        <div class="flex-grow-1 position-relative">
                            <label class="btn border border-clay text-plum rounded-0 hover-border-plum transition-colors cursor-pointer">
                                Thay đổi Logo
                                <input type="file" class="d-none" accept="image/*">
                            </label>
                            <div class="text-muted small mt-2">Dung lượng tối đa 2MB, định dạng JPEG/PNG.</div>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Tên Gian Hàng *</label>
                        <input type="text" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum" value="NOLA Official" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Mô tả gian hàng</label>
                        <textarea class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum" rows="4">Chuyên cung cấp các sản phẩm phụ kiện thời trang cao cấp.</textarea>
                    </div>

                    <h5 class="fw-bold text-plum mb-4 pb-2 border-bottom mt-5">Thông tin liên hệ</h5>

                    <div class="mb-4">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Số điện thoại *</label>
                        <input type="text" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum" value="0901234567" required>
                    </div>

                    <div class="mb-5">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Địa chỉ lấy hàng *</label>
                        <input type="text" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum" value="123 Đường Lê Lợi, Phường Bến Thành, Quận 1, TPHCM" required>
                    </div>

                    <div class="d-flex justify-content-end gap-3">
                        <button type="submit" class="btn bg-burgundy text-white rounded-0 fw-medium px-5 py-3 border-0 hover-bg-plum transition-colors">Lưu Thay Đổi</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
