<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Thêm Sản Phẩm')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main class="w-100 mx-auto px-3 px-md-4 py-5 max-w-1440">
        <div class="row gx-lg-5">
            <!-- Sidebar Navigation for Seller -->
            <div class="col-12 col-md-3 mb-5 mb-md-0">
                <div class="d-flex flex-column gap-3 sticky-top" style="top: 100px;">
                    <h4 class="text-serif text-plum mb-4">Kênh Người Bán</h4>
                    <a th:href="@{/merchant/dashboard}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100"><i class="bi bi-graph-up me-2"></i>Thống kê</a>
                    <a th:href="@{/merchant/products}" class="fw-bold text-burgundy text-decoration-none border-bottom border-burgundy pb-2 d-inline-block w-100"><i class="bi bi-box-seam me-2"></i>Quản lý sản phẩm</a>
                    <a th:href="@{/merchant/orders}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100"><i class="bi bi-receipt me-2"></i>Quản lý đơn hàng</a>
                    <a th:href="@{/merchant/profile}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100"><i class="bi bi-shop me-2"></i>Thông tin gian hàng</a>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-12 col-md-9">
                <div class="mb-4">
                    <a th:href="@{/merchant/products}" class="text-muted text-decoration-none hover-plum transition-colors"><i class="bi bi-arrow-left me-2"></i>Quay lại danh sách sản phẩm</a>
                </div>
                
                <h2 class="text-serif text-plum mb-4">Thêm Sản Phẩm Mới</h2>
                
                <form class="bg-white p-4 p-md-5 border border-clay shadow-sm">
                    <h5 class="fw-bold text-plum mb-4 pb-2 border-bottom">Thông tin cơ bản</h5>
                    
                    <div class="mb-4">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Tên sản phẩm *</label>
                        <input type="text" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum" required>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6 mb-4 mb-md-0">
                            <label class="form-label text-uppercase fw-medium text-plum small mb-2">Danh mục *</label>
                            <select class="form-select bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum" required>
                                <option value="" selected disabled>Chọn danh mục</option>
                                <option value="1">Thời trang</option>
                                <option value="2">Làm đẹp</option>
                                <option value="3">Nhà cửa</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-uppercase fw-medium text-plum small mb-2">Thương hiệu</label>
                            <input type="text" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum">
                        </div>
                    </div>

                    <div class="mb-5">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Mô tả sản phẩm *</label>
                        <textarea class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum" rows="6" required></textarea>
                    </div>

                    <h5 class="fw-bold text-plum mb-4 pb-2 border-bottom">Bán hàng & Kho</h5>
                    
                    <div class="row mb-5">
                        <div class="col-md-6 mb-4 mb-md-0">
                            <label class="form-label text-uppercase fw-medium text-plum small mb-2">Giá bán (VNĐ) *</label>
                            <input type="number" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-uppercase fw-medium text-plum small mb-2">Số lượng tồn kho *</label>
                            <input type="number" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum" required>
                        </div>
                    </div>

                    <h5 class="fw-bold text-plum mb-4 pb-2 border-bottom">Hình ảnh</h5>
                    
                    <div class="mb-5">
                        <div class="d-flex gap-3 flex-wrap">
                            <label class="bg-ivory border border-clay d-flex flex-column align-items-center justify-content-center cursor-pointer hover-bg-clay transition-colors position-relative" style="width: 120px; height: 120px;">
                                <input type="file" class="d-none" accept="image/*" required>
                                <i class="bi bi-plus-lg text-muted fs-3 mb-2"></i>
                                <span class="small text-muted text-center px-2">Ảnh chính</span>
                            </label>
                            <label class="bg-ivory border border-clay d-flex flex-column align-items-center justify-content-center cursor-pointer hover-bg-clay transition-colors position-relative" style="width: 120px; height: 120px;">
                                <input type="file" class="d-none" accept="image/*" multiple>
                                <i class="bi bi-camera text-muted fs-4"></i>
                            </label>
                        </div>
                        <div class="text-muted small mt-2">Tải lên tối đa 5 hình ảnh (JPEG/PNG). Ảnh đầu tiên sẽ làm ảnh chính.</div>
                    </div>

                    <div class="d-flex justify-content-end gap-3">
                        <button type="button" class="btn border border-clay text-plum rounded-0 fw-medium px-4 py-3 hover-border-plum transition-colors">Hủy</button>
                        <button type="submit" class="btn bg-burgundy text-white rounded-0 fw-medium px-5 py-3 border-0 hover-bg-plum transition-colors">Lưu Sản Phẩm</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
